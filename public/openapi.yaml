openapi: 3.1.0
info:
  title: Agent Kanban API
  version: 1.0.0
  description: |
    HTTP API for controlling Agent Kanban from an external harness. Create a
    personal token in the user menu and send it as `Authorization: Bearer ...`.
    A token has exactly the same project access and role as its active user.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Wiki
  - name: Project chat
  - name: Hierarchy
  - name: Tasks
  - name: Agent runs
  - name: Collaboration
  - name: Refinements
  - name: Administration
paths:
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects visible to the current user
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Administration]
      operationId: createProject
      summary: Create a project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}:
    patch:
      tags: [Administration]
      operationId: updateProject
      summary: Update a project and its membership (admin only)
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/board:
    get:
      tags: [Projects]
      operationId: getBoard
      summary: Get the board, columns, hierarchy, members, tags, and tasks
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/wiki/pages:
    get:
      tags: [Wiki]
      operationId: listWikiPages
      summary: List the complete project-local wiki page tree
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Wiki]
      operationId: createWikiPage
      summary: Create a root page or child page in the project wiki
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WikiPageWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/wiki-pages/{pageId}:
    get:
      tags: [Wiki]
      operationId: getWikiPage
      summary: Get one complete Wiki page including its Markdown content and revision
      parameters: [{ $ref: '#/components/parameters/WikiPageId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Wiki]
      operationId: updateWikiPage
      summary: Update wiki page content, title, parent, or position
      parameters: [{ $ref: '#/components/parameters/WikiPageId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WikiPageWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Wiki]
      operationId: deleteWikiPage
      summary: Delete a wiki page that has no child pages
      parameters: [{ $ref: '#/components/parameters/WikiPageId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/wiki-pages/{pageId}/move:
    post:
      tags: [Wiki]
      operationId: moveWikiPage
      summary: Atomically reorder a Wiki page or move it below another page
      parameters: [{ $ref: '#/components/parameters/WikiPageId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WikiPageMove' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/chat:
    get:
      tags: [Project chat]
      operationId: getCurrentProjectChat
      summary: Get the current private project chat for the signed-in user
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/WikiPageContext' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/chats:
    get:
      tags: [Project chat]
      operationId: listPrivateProjectChats
      summary: List private chat history for the signed-in user
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/WikiPageContext' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Project chat]
      operationId: createPrivateProjectChat
      summary: Create and activate a private read-only project chat
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectChatConfig' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/project-chats/{chatId}:
    get:
      tags: [Project chat]
      operationId: getPrivateProjectChat
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Project chat]
      operationId: updatePrivateProjectChatConfig
      summary: Change harness or effort before the first message
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectChatConfig' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/project-chats/{chatId}/activate:
    post:
      tags: [Project chat]
      operationId: activatePrivateProjectChat
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/project-chats/{chatId}/messages:
    post:
      tags: [Project chat]
      operationId: sendPrivateProjectChatMessage
      summary: Start a source-read-only chat turn with explicitly requested Kanban and Wiki actions
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 24000 }
                clientRequestId: { type: [string, 'null'], minLength: 8, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/project-chats/{chatId}/events:
    get:
      tags: [Project chat]
      operationId: streamPrivateProjectChatEvents
      summary: Stream sanitized chat events with resumable SSE ids
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/project-chats/{chatId}/abort:
    post:
      tags: [Project chat]
      operationId: abortPrivateProjectChatTurn
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ChatId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/tasks:
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: Use clientRequestId for safe retries. JSON and multipart/form-data are accepted.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskCreate'
                - type: object
                  properties:
                    file: { type: array, items: { type: string, format: binary } }
                    annotations: { type: string, description: Optional JSON annotation array used by the web UI }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/oberthemen:
    post:
      tags: [Hierarchy]
      operationId: createParentTopic
      summary: Create a parent topic
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentTopicWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/hierarchy-order:
    patch:
      tags: [Hierarchy]
      operationId: reorderHierarchy
      summary: Replace the complete parent/sub-topic order
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oberthemaIds, unterthemen]
              properties:
                oberthemaIds: { type: array, items: { type: string } }
                unterthemen:
                  type: array
                  items:
                    type: object
                    required: [oberthemaId, ids]
                    properties:
                      oberthemaId: { type: string }
                      ids: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/projects/{projectId}/swimlanes:
    post:
      tags: [Hierarchy]
      operationId: createSwimlane
      summary: Create a swimlane
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nameEn]
              properties:
                nameEn: { type: string, minLength: 1 }
                nameDe: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/oberthemen/{oberthemaId}:
    patch:
      tags: [Hierarchy]
      operationId: updateParentTopic
      parameters: [{ $ref: '#/components/parameters/OberthemaId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentTopicWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Hierarchy]
      operationId: deleteParentTopic
      summary: Delete an empty parent topic
      parameters: [{ $ref: '#/components/parameters/OberthemaId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/oberthemen/{oberthemaId}/unterthemen:
    post:
      tags: [Hierarchy]
      operationId: createSubtopic
      parameters: [{ $ref: '#/components/parameters/OberthemaId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubtopicWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/unterthemen/{unterthemaId}:
    patch:
      tags: [Hierarchy]
      operationId: updateSubtopic
      parameters: [{ $ref: '#/components/parameters/UnterthemaId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubtopicWrite' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Hierarchy]
      operationId: deleteSubtopic
      summary: Delete an empty sub-topic
      parameters: [{ $ref: '#/components/parameters/UnterthemaId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get task details, activity, files, comments, and hierarchy
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update task content or board placement
      description: Agent lifecycle state is changed only through the queue, cancel, and retry actions.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Tasks]
      operationId: deleteTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/agent/queue:
    post:
      tags: [Agent runs]
      operationId: queueTaskAgent
      summary: Enable agent execution and place the task in To Do
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/agent/cancel:
    post:
      tags: [Agent runs]
      operationId: cancelTaskAgent
      summary: Cancel a queued or running agent task
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/agent/retry:
    post:
      tags: [Agent runs]
      operationId: retryTaskAgent
      summary: Queue a failed or completed task again
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/comments:
    post:
      tags: [Collaboration]
      operationId: addTaskComment
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                mentionUserIds: { type: array, maxItems: 25, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/messages:
    post:
      tags: [Collaboration]
      operationId: steerTaskAgent
      summary: Send guidance to a queued or running agent
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, minLength: 1 } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/attachments:
    post:
      tags: [Collaboration]
      operationId: addTaskAttachments
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: array, items: { type: string, format: binary } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/attachments/{attachmentId}:
    get:
      tags: [Collaboration]
      operationId: getTaskAttachment
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/AttachmentId' }
        - name: variant
          in: query
          schema: { type: string, enum: [annotated] }
        - name: download
          in: query
          schema: { type: string, enum: ['1'] }
      responses:
        '200': { description: Attachment bytes }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Collaboration]
      operationId: deleteTaskAttachment
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/refinements:
    get:
      tags: [Refinements]
      operationId: listTaskRefinements
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Refinements]
      operationId: createTaskRefinement
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brief: { type: [string, 'null'], maxLength: 4000 }
                visualMode: { type: string, enum: [auto, off, force] }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/refinements/{refinementId}:
    get:
      tags: [Refinements]
      operationId: getTaskRefinement
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/RefinementId' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/refinements/{refinementId}/answers:
    post:
      tags: [Refinements]
      operationId: answerRefinementQuestions
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/RefinementId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/tasks/{taskId}/refinements/{refinementId}/apply:
    post:
      tags: [Refinements]
      operationId: applyTaskRefinement
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/RefinementId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [replace, append] }
                expectedTaskUpdatedAt: { type: string }
                markdown: { type: string, minLength: 1, maxLength: 200000 }
                allowDescriptionOverwrite: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/command-palette:
    get:
      tags: [Projects]
      operationId: searchWorkspace
      summary: Get the authorized cross-project task and hierarchy search index
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/users:
    get:
      tags: [Administration]
      operationId: listUsers
      summary: List active users (admin only)
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Administration]
      operationId: createUser
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/users/{userId}:
    patch:
      tags: [Administration]
      operationId: updateUser
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Administration]
      operationId: deactivateUser
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AgentKanbanPersonalToken
    cookieAuth:
      type: apiKey
      in: cookie
      name: ak_session
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    WikiPageId: { name: pageId, in: path, required: true, schema: { type: string, format: uuid } }
    WikiPageContext: { name: wikiPageId, in: query, required: false, schema: { type: string, format: uuid }, description: Bind chat selection and history to one Wiki page }
    ChatId: { name: chatId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    OberthemaId: { name: oberthemaId, in: path, required: true, schema: { type: string, format: uuid } }
    UnterthemaId: { name: unterthemaId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    RefinementId: { name: refinementId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    ObjectResponse:
      description: Successful JSON response
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    ErrorResponse:
      description: Request error
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  schemas:
    ProjectWrite:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        key: { type: string, minLength: 1, maxLength: 12 }
        description: { type: [string, 'null'] }
        folderPath: { type: string, minLength: 1 }
        userIds: { type: array, items: { type: string, format: uuid } }
        tags: { type: array, items: { type: string } }
        agentConcurrencyLimit: { type: integer, minimum: 0, maximum: 100, default: 1 }
        agentHarnessLimits:
          type: object
          required: [codex, opencode, prime-agent]
          properties:
            codex: { type: integer, minimum: 0, maximum: 100, default: 1 }
            opencode: { type: integer, minimum: 0, maximum: 100, default: 1 }
            prime-agent: { type: integer, minimum: 0, maximum: 100, default: 1 }
    WikiPageWrite:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, maxLength: 1000000, description: Markdown content }
        parentId: { type: [string, 'null'], format: uuid }
        position: { type: integer, minimum: 0, maximum: 1000000000 }
        expectedUpdatedAt: { type: string, format: date-time, description: Reject the write with wiki_page_stale if the page changed since it was read }
    WikiPageMove:
      type: object
      required: [parentId, position]
      properties:
        parentId: { type: [string, 'null'], format: uuid, description: Parent page or null for the project Wiki root }
        position: { type: integer, minimum: 0, maximum: 500, description: Zero-based position among the target parent's children }
        expectedUpdatedAt: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        columnId: { type: [string, 'null'], format: uuid }
        swimlaneId: { type: [string, 'null'], format: uuid }
        oberthemaId: { type: [string, 'null'], format: uuid }
        unterthemaId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        agentEnabled: { type: boolean, default: false }
        agentHarness: { $ref: '#/components/schemas/AgentHarness' }
        reasoningEffort: { $ref: '#/components/schemas/ReasoningEffort' }
        clientRequestId: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
        priority: { $ref: '#/components/schemas/Priority' }
        tags: { type: array, items: { type: string } }
    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        columnId: { type: string, format: uuid }
        swimlaneId: { type: [string, 'null'], format: uuid }
        oberthemaId: { type: string, format: uuid }
        unterthemaId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        agentEnabled: { type: boolean }
        agentHarness: { $ref: '#/components/schemas/AgentHarness' }
        reasoningEffort: { $ref: '#/components/schemas/ReasoningEffort' }
        priority: { $ref: '#/components/schemas/Priority' }
        tags: { type: array, items: { type: string } }
        position: { type: integer }
    ParentTopicWrite:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        color: { type: string, enum: [teal, coral, amber, indigo, emerald] }
        position: { type: integer, minimum: 0 }
    SubtopicWrite:
      type: object
      properties:
        oberthemaId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        position: { type: integer, minimum: 0 }
    AgentHarness:
      type: string
      enum: [codex, opencode, prime-agent]
      default: codex
    ProjectChatConfig:
      type: object
      properties:
        harness:
          allOf: [{ $ref: '#/components/schemas/AgentHarness' }]
          default: prime-agent
        reasoningEffort: { $ref: '#/components/schemas/ReasoningEffort' }
        wikiPageId: { type: [string, 'null'], format: uuid, description: Create a conversation bound to this Wiki page }
    ReasoningEffort:
      type: string
      enum: [low, medium, xhigh]
      default: xhigh
    UserCreate:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [admin, member], default: member }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        email: { type: string, format: email, maxLength: 320 }
        name: { type: string, minLength: 1, maxLength: 160 }
        password: { type: string, minLength: 8, maxLength: 512 }
        role: { type: string, enum: [admin, member] }
    Priority:
      type: string
      enum: [low, normal, high, urgent]
