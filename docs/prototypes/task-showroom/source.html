<div id="ak-showroom-proposal" role="region" lang="de" aria-label="Task mit eingebundenem Showroom"></div>
<script>
(()=>{
const root=document.getElementById('ak-showroom-proposal');
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(label,action,style='',extra='')=>`<button type="button" class="ak-button ${style}" data-action="${action}" ${extra}>${label}</button>`;
const badge=(label,type='')=>`<span class="ak-badge ${type}">${label}</span>`;
const taskKey='AGENTKANBAN-42';
const views=[{id:'invite',name:'Einladung',kind:'Formular',file:'einladung.html',folder:'task'},{id:'members',name:'Mitglieder',kind:'Übersicht',file:'mitglieder.html',folder:'task'},{id:'empty',name:'Noch kein Team',kind:'Leerzustand',file:'leerzustand.html',folder:'task'},{id:'nav',name:'Navigation · kompakt',kind:'Referenz',file:'navigation.html',folder:'basics'},{id:'buttons',name:'Buttons & Zustände',kind:'Referenz',file:'buttons.html',folder:'basics'},{id:'settings',name:'Projekteinstellungen',kind:'Formular',file:'projekt.html',folder:'settings'},{id:'roles',name:'Rollen & Rechte',kind:'Übersicht',file:'rollen.html',folder:'settings'}];
const folders=[{id:'task',name:'Team-Einladungen',path:'agentkanban-42-team-einladungen',detail:'3 Ansichten · Desktop & Mobil'},{id:'basics',name:'Grundlagen',path:'grundlagen',detail:'2 Ansichten · Navigation, Buttons'},{id:'settings',name:'Projekt-Einstellungen',path:'projekt-einstellungen',detail:'2 Ansichten · Allgemein, Rollen'}];
const baseViews=views.map(v=>({...v})),baseFolders=folders.map(f=>({...f}));
let state,runTimer;
const design={layout:'cards',showPaths:true};
function initial(scene='linked'){
 clearTimeout(runTimer);
 views.splice(0,views.length,...baseViews.map(v=>({...v})));folders.splice(0,folders.length,...baseFolders.map(f=>({...f})));
 state={scene,page:'task',tab:scene==='empty'?'order':'showroom',links:scene==='linked'?[{id:'task',type:'folder',mode:'follow'},{id:'nav',type:'view',mode:'follow'}]:[],version:2,reviewVersion:2,selected:'invite',viewport:'desktop',mobile:true,desktop:true,published:true,legacy:scene==='legacy',converted:false,openFrom:'task',spec:null,notice:'',step:0,comments:[{id:1,view:'invite',version:2,body:'Die Erfolgsmeldung soll die eingeladene E-Mail-Adresse nennen.',author:'Patrick',resolved:false,pin:null}],events:['Showroom-Ordner und Referenz verknüpft'],pickMode:'folder',picks:new Set(),pickQuery:'',pickVersion:'follow',inviteSent:false,pinMode:false,pin:null,folderFilter:'task',draftBrief:'Teammitglieder per E-Mail einladen. Rolle direkt wählen und eine eindeutige Bestätigung anzeigen.',draftFolder:'agentkanban-42-team-einladungen',draftDesktop:true,draftMobile:true,draftHarness:'Codex',draftError:'',available:['invite','members','empty'],notes:'Rolle bei der Einladung wählen. Erfolg und leeren Zustand berücksichtigen.'};
 render();
}
function viewBy(id){return views.find(v=>v.id===id)||views[0]}
function folderBy(id){return folders.find(f=>f.id===id)||folders[0]}
function currentViews(){return views.filter(v=>v.folder!=='task'||state.available.includes(v.id))}
function linkedViews(){return currentViews().filter(v=>state.links.some(l=>l.type==='view'?l.id===v.id:l.id===v.folder))}
function isLinked(item,type){return state.links.some(l=>l.type==='folder'?(type==='folder'?l.id===item.id:l.id===item.folder):(type==='view'&&l.id===item.id))}
function note(html,type=''){return `<div class="ak-note ${type}">${icon(type==='ak-warning'?'info':type==='ak-success'?'check':'link-2')}<div>${html}</div></div>`}
function back(label='Zurück zum Task',action='back-task'){return `<div class="ak-back"><button type="button" class="ak-link" data-action="${action}">${icon('arrow-left')}${label}</button></div>`}
function tiny(view){
 let content=view.id==='members'?`<strong>Teammitglieder</strong><div class="ak-tiny-person"><span>PM · Patrick</span><span>Admin</span></div><div class="ak-tiny-person"><span>LS · Lea</span><span>Mitglied</span></div>`:view.id==='empty'?`<div class="ak-tiny-empty">${icon('users')}<strong>Platz für dein Team.</strong><span>Gemeinsam loslegen</span><div class="ak-tiny-action">Person einladen</div></div>`:view.id==='invite'?`<strong>Team einladen</strong><div class="ak-tiny-input">lea@studio.ch</div><div class="ak-tiny-person"><span>Rolle</span><span>Mitglied⌄</span></div><div class="ak-tiny-action">Einladung senden</div>`:view.id==='nav'?`<strong>Agent Kanban</strong><div class="ak-tiny-input">▤ Board</div><div class="ak-tiny-input">Showroom</div>`:`<strong>${esc(view.name)}</strong><div class="ak-tiny-input">Allgemein</div><div class="ak-tiny-action">Änderungen speichern</div>`;
 return `<div class="ak-tiny-ui" aria-hidden="true"><div class="ak-tiny-window">${content}</div></div>`;
}
function viewCard(v,project=false){const count=state.comments.filter(c=>c.view===v.id&&!c.resolved).length;return `<article class="ak-view"><button type="button" class="ak-thumbnail" data-action="view" data-id="${v.id}" aria-label="${esc(v.name)} öffnen">${tiny(v)}</button><div class="ak-caption"><strong>${esc(v.name)}</strong><div class="ak-row"><span class="ak-muted">${state.converted&&v.folder==='task'?'App-Screenshot':v.kind}</span><span class="ak-muted">${count?`${count} Feedback`:v.folder==='task'?'V'+state.version:'V1'}</span></div>${project&&isLinked(v,'view')?`<div class="ak-row"><button type="button" class="ak-link" data-action="back-task">${icon('link-2')}${taskKey}</button></div>`:''}</div></article>`}
function empty(){return `<div class="ak-empty"><span class="ak-folder-symbol">${icon('panels-top-left')}</span><div><h2>Ein Platz für den visuellen Teil.</h2><p style="margin-top:8px">Entwirf die Oberfläche im Showroom oder verknüpfe Ansichten, die es bereits gibt.</p></div><div class="ak-row">${b(icon('sparkles')+'Im Showroom entwerfen','create','ak-primary')}${b(icon('link-2')+'Bestehendes verknüpfen','picker')}</div></div>`}
function library(){
 const linked=linkedViews();
 return `<div class="ak-toolbar"><div><h2>Mit diesem Task verknüpft</h2><p class="ak-muted" style="margin-top:4px">${linked.length?`${linked.length} Ansichten · Vorschau und Feedback aus dem Showroom`:'Entwürfe und Referenzen für diese Aufgabe'}</p></div><div class="ak-row">${b(icon('link-2')+'Verknüpfen','picker')}${b(icon('plus')+'Neu erstellen','create','ak-primary')}</div></div>
 ${state.legacy?legacy():''}${state.spec?note(`<strong>V${state.spec.version} ist als Umsetzungsvorgabe festgehalten.</strong>${state.version>state.spec.version?` Neuer Stand: V${state.version}. Die Vorgabe bleibt unverändert.`:''}<div class="ak-row"><button class="ak-link" type="button" data-action="spec-view">${icon('lock-keyhole')}Vorgabe ansehen</button></div>`,'ak-success'):''}
 ${!linked.length&&!state.legacy?empty():''}
 ${state.links.filter(l=>l.type==='folder').map(l=>{const folder=folderBy(l.id);const children=linked.filter(v=>v.folder===l.id);return `<section class="ak-folder"><header class="ak-folder-head"><span class="ak-folder-symbol">${icon('folder')}</span><div class="ak-folder-info"><div class="ak-folder-title"><h3>${esc(folder.name)}</h3>${badge('Ganzer Ordner')}${l.id==='task'?badge(state.published?'Im Showroom':'Interner Entwurf',state.published?'ak-teal':'ak-amber'):''}</div>${design.showPaths?`<code>showroom/${esc(folder.path)}/</code>`:''}</div>${b(icon('arrow-up-right')+'Im Showroom','project','','data-folder="'+l.id+'"')}</header><div class="ak-gallery">${children.map(v=>viewCard(v)).join('')}</div><footer class="ak-folder-foot"><span class="ak-muted">${icon('refresh-cw')} ${l.mode==='pinned'?'Fixierter Stand V'+(l.version||state.version):'Neue Ansichten werden automatisch einbezogen.'}</span><div class="ak-row">${b(icon('bookmark-check')+'Als Vorgabe festhalten','approve','','data-folder="'+l.id+'"')}${b(icon('unlink'),'unlink','ak-quiet','data-id="'+l.id+'" data-type="folder" aria-label="Ordner-Verknüpfung entfernen"')}</div></footer></section>`}).join('')}
 ${state.links.filter(l=>l.type==='view'&&!state.links.some(f=>f.type==='folder'&&f.id===viewBy(l.id).folder)).map(l=>{const v=viewBy(l.id);return `<div class="ak-reference"><span class="ak-folder-symbol">${icon('panel-top')}</span><div class="ak-ref-copy"><h3>${esc(v.name)}</h3><span class="ak-muted">${esc(folderBy(v.folder).name)} · Einzelne Ansicht · ${l.mode==='pinned'?'Fixiert V1':'Aktueller Stand'}</span></div>${badge('Referenz')}${b('Öffnen '+icon('arrow-up-right'),'view','','data-id="'+v.id+'"')}${b(icon('unlink'),'unlink','ak-quiet','data-id="'+l.id+'" data-type="view" aria-label="Ansichts-Verknüpfung entfernen"')}</div>`}).join('')}
 ${linked.length?`<div class="ak-row ak-between" style="margin-top:20px"><span class="ak-muted">${state.converted?'Übernommen aus bisherigem visuellem Refinement.':'Entstanden für diesen Task. Auch direkt im Showroom bearbeitbar.'}</span>${!state.published?b('Im Projekt bereitstellen','publish'):'<button type="button" class="ak-link" data-action="project">Projekt-Showroom öffnen '+icon('arrow-right')+'</button>'}</div>`:''}`;
}
function legacy(){return note(`<strong>Bisheriger visueller Entwurf · V2</strong><p style="margin:5px 0 10px">3 App-Screens, 1 Feedback und eine freigegebene Vorgabe sind vorhanden.</p>${b('In Showroom übernehmen','migrate','ak-primary')}`,'ak-warning')}
function order(){return `<div class="ak-spec-layout"><div><div class="ak-row ak-between"><h2>Auftrag</h2>${badge('Menschliche Aufgabe')}</div><p class="ak-body-copy">Teammitglieder sollen direkt per E-Mail eingeladen werden können. Die Rolle wird beim Einladen gewählt. Zeige eine klare Bestätigung und einen hilfreichen Einstieg, solange noch niemand im Team ist.</p><div class="ak-row" style="margin-bottom:22px"><span class="ak-badge">Teamverwaltung</span><span class="ak-badge">UI / UX</span></div>${state.spec?`<section class="ak-spec"><div class="ak-row ak-between"><h3>${icon('bookmark-check')} Visuelle Umsetzung</h3>${badge('V'+state.spec.version+' · Festgehalten','ak-teal')}</div><p>${esc(state.spec.notes||'Die ausgewählten Ansichten bilden die Umsetzungsvorgabe.')}</p><div class="ak-row" style="margin-bottom:14px">${state.spec.ids.map(id=>badge(esc(viewBy(id).name))).join('')}</div><div class="ak-row ak-between"><span class="ak-muted">${icon('lock-keyhole')} Stand vom 18.09.2026 · Patrick</span>${b('Vorgabe öffnen '+icon('arrow-up-right'),'spec-view')}</div></section>${state.version>state.spec.version?note(`Im Showroom ist V${state.version} verfügbar. Die Umsetzungsvorgabe bleibt V${state.spec.version}.`,'ak-warning'):''}`:''}<section class="ak-note" style="margin-top:24px;display:block"><h3 style="margin-bottom:12px">${icon('wand-sparkles')} Idee ausarbeiten</h3>${b(icon('file-pen-line')+'Mit KI ausarbeiten'+icon('chevron-right'),'text-info','','style="width:100%;justify-content:space-between"')}</section></div><aside class="ak-meta"><dl><dt>Status</dt><dd>${badge('In Planung','ak-amber')}</dd><dt>Verantwortlich</dt><dd>Patrick Michel</dd><dt>Projekt</dt><dd>Agent Kanban</dd><dt>Verknüpfte Ansichten</dt><dd>${linkedViews().length}</dd><dt>Umsetzungsvorgabe</dt><dd style="margin-bottom:0">${state.spec?'Version '+state.spec.version:'Noch keine'}</dd></dl></aside></div>`}
function picker(){
 const list=state.pickMode==='folder'?folders:currentViews();
 const query=state.pickQuery.toLocaleLowerCase();
 const shown=list.filter(x=>(x.name+' '+(x.path||folderBy(x.folder).path)).toLocaleLowerCase().includes(query));
 return `${back()}<div class="ak-form"><h2>Aus dem Showroom verknüpfen</h2><p class="ak-subtitle">Agent Kanban · Ordner oder einzelne Ansichten auswählen</p><div class="ak-row" style="margin-top:21px"><label class="ak-choice"><input type="radio" name="scope" value="folder" ${state.pickMode==='folder'?'checked':''}>${icon('folder')}Ganze Ordner</label><label class="ak-choice"><input type="radio" name="scope" value="view" ${state.pickMode==='view'?'checked':''}>${icon('panel-top')}Einzelne Ansichten</label></div><label class="ak-field">Showroom durchsuchen<input id="ak-search" placeholder="Name oder Ordner …" value="${esc(state.pickQuery)}"></label><div class="ak-picklist" id="ak-picklist">${shown.map(x=>{const linked=isLinked(x,state.pickMode);return `<label class="ak-pickrow"><input type="checkbox" data-pick="${x.id}" ${linked||state.picks.has(x.id)?'checked':''} ${linked?'disabled':''}>${icon(state.pickMode==='folder'?'folder':'panel-top')}<div><strong>${esc(x.name)}</strong><code>${esc(state.pickMode==='folder'?x.path+'/':folderBy(x.folder).path+'/'+x.file)}</code><small>${state.pickMode==='folder'?x.detail:x.kind}</small></div>${linked?badge('Verknüpft','ak-teal'):''}</label>`}).join('')||'<div class="ak-pickrow">Keine Treffer. Versuche einen anderen Namen.</div>'}</div>${state.pickMode==='folder'?`<p class="ak-muted" style="margin-top:13px">${icon('refresh-cw')} Einschliesslich Unterordnern. Neue Ansichten erscheinen automatisch.</p>`:`<label class="ak-field">Version<select id="ak-link-version"><option value="follow" ${state.pickVersion==='follow'?'selected':''}>Aktueller Stand · folgt neuen Versionen</option><option value="pinned" ${state.pickVersion==='pinned'?'selected':''}>Diesen Stand fixieren</option></select></label>`}<footer class="ak-form-foot"><span class="ak-muted" id="ak-pick-summary">${state.picks.size} ${state.pickMode==='folder'?'Ordner':'Ansichten'} ausgewählt</span><div class="ak-row">${b('Abbrechen','back-task')}${b(icon('link-2')+'Auswahl verknüpfen','link-save','ak-primary',state.picks.size?'':'disabled')}</div></footer></div>`;
}
function create(){return `${back()}<div class="ak-form"><div class="ak-row ak-between"><h2>Im Showroom entwerfen</h2>${badge(taskKey)}</div><p class="ak-subtitle">Die KI leitet passende Ansichten aus dem Auftrag ab und legt sie automatisch im Showroom ab.</p><label class="ak-field">Was soll entstehen?<textarea id="ak-brief" required>${esc(state.draftBrief)}</textarea></label><div class="ak-fields"><div><div class="ak-field" style="margin-bottom:9px">Darstellung</div><div class="ak-row"><label class="ak-check"><input id="ak-desktop" type="checkbox" ${state.draftDesktop?'checked':''}>Desktop</label><label class="ak-check"><input id="ak-mobile" type="checkbox" ${state.draftMobile?'checked':''}>Mobil</label></div></div><label class="ak-field">Agent<select id="ak-harness"><option ${state.draftHarness==='Codex'?'selected':''}>Codex</option><option ${state.draftHarness==='Claude'?'selected':''}>Claude</option></select></label></div>${state.draftError?`<p role="alert" style="color:var(--ak-red);margin-top:15px">${esc(state.draftError)}</p>`:''}<div style="margin-top:22px">${note('Zunächst als interner Entwurf. Vor der Bereitstellung im Projekt-Showroom kannst du die Ansichten prüfen.')}</div><footer class="ak-form-foot"><span class="ak-muted">Mit diesem Task verbunden</span><div class="ak-row">${b('Abbrechen','back-task')}${b(icon('sparkles')+'Entwurf starten','start','ak-primary')}</div></footer></div>`}
function running(){return `${back()}<div class="ak-form" style="padding-top:32px"><span class="ak-badge ak-teal">${icon('sparkles')}Demo-Lauf</span><h2 style="margin-top:15px">${state.runType==='iterate'?'Nächste Version entsteht.':'Dein Showroom-Entwurf entsteht.'}</h2><p class="ak-subtitle">${esc(state.draftFolder)} · V${state.nextVersion}</p><div class="ak-progress">${['Auftrag vorbereiten','Ansichten erstellen','Im Task verknüpfen'].map((label,i)=>`<div class="${state.step>=i?'ak-finished':''}">${i+1} · ${label}</div>`).join('')}</div><p class="ak-muted">Der letzte gültige Entwurf bleibt verfügbar.</p><div class="ak-row" style="margin-top:25px">${b('Lauf abbrechen','cancel-run')}</div></div>`}
function sample(v){
 if(state.converted&&v.folder==='task')return `<div class="ak-demo-ui">${badge('App-Screenshot · Übernommener Altbestand','ak-amber')}<div style="margin-top:25px">${tiny(v)}</div><p style="margin-top:22px">Original: ${esc(v.name)} · 1440 × 900</p></div>`;

 if(v.id==='invite')return `<div class="ak-demo-ui">${head}<h3>Lade dein Team ein.</h3><p>Gute Arbeit entsteht gemeinsam.</p>${state.inviteSent?note(`<strong>Einladung versendet</strong><div>${state.reviewVersion>=3?'Die Einladung an '+esc(state.sentEmail)+' ist unterwegs.':'Dein Teammitglied erhält eine E-Mail.'}</div>`,'ak-success'):''}<div class="ak-invite-fields"><div><label for="ak-invite-email">E-Mail-Adresse</label><input id="ak-invite-email" type="email" value="lea@studio.ch" placeholder="name@team.ch"></div><div><label for="ak-invite-role">Rolle</label><select id="ak-invite-role"><option>Mitglied</option><option>Admin</option></select></div></div><div class="ak-demo-actions"><span class="ak-muted">${icon('shield-check')} Nur für dein Projekt</span>${b('Einladung senden '+icon('arrow-right'),'send-invite','ak-primary')}</div></div>`;

function render(){
 const active=document.activeElement;const focusId=root.contains(active)?active.id:null;const focusAction=root.contains(active)?active.dataset.action:null;const focusItem=root.contains(active)?active.dataset.id:null;

a-action="tab-showroom" ${state.tab==='showroom'?'aria-current="page"':''}>${icon('panels-top-left')}Showroom <span class="ak-count">${linkedViews().length}</span></button><button type="button" class="ak-tab ${state.page==='task'&&state.tab==='activity'?'ak-on':''}" data-action="tab-activity">${icon('messages-square')}Aktivität</button></nav>`:''}<main class="ak-content">${content}</main>${state.notice?`<div class="ak-notice" role="status">${icon('check')}${esc(state.notice)}</div>`:''}<footer class="ak-footer"><span>${icon('link-2')}${isProject?'Showroom und Task nutzen denselben Inhalt':'Task-Kontext bleibt erhalten'}</span><span>${icon('flask-conical')}Konzept · keine produktiven Änderungen</span></footer></div>`;
 if(globalThis.lucide)lucide.createIcons({root,attrs:{width:16,height:16}});
 const restored=focusId?root.querySelector('#'+CSS.escape(focusId)):focusAction?Array.from(root.querySelectorAll('[data-action]')).find(el=>el.dataset.action===focusAction&&el.dataset.id===focusItem):null;if(restored)restored.focus({preventScroll:true});

function showNotice(message){state.notice=message}

function startRun(type){clearTimeout(runTimer);state.page='running';state.runType=type;state.step=0;state.nextVersion=type==='iterate'||state.links.some(l=>l.id==='task')?state.version+1:1;state.notice='';render();runTimer=setTimeout(()=>{state.step=1;render();runTimer=setTimeout(()=>{state.step=2;render();runTimer=setTimeout(()=>completeRun(type),650)},850)},650)}
function completeRun(type){state.version=state.nextVersion;state.reviewVersion=state.version;state.readSpec=false;state.published=false;state.converted=false;state.mobile=state.draftMobile;state.desktop=state.draftDesktop;state.viewport=state.desktop?'desktop':'mobile';folders[0].path=state.draftFolder;if(type==='create'){const names=baseViews.filter(v=>v.folder==='task').map(v=>v.name);state.available=names.map((name,i)=>{let v=views.filter(x=>x.folder==='task')[i];if(!v){v={id:'custom'+i,folder:'task',name,kind:'Ansicht',file:'ansicht-'+(i+1)+'.html'};views.push(v)}v.name=name;return v.id});folders[0].detail=names.length+' Ansichten · '+(state.draftMobile?'Desktop & Mobil':'Desktop')}if(type==='iterate'&&state.derivedSource){const derived={...state.derivedSource,id:'derived-'+state.version,folder:'task'};views.push(derived);state.available.push(derived.id);state.selected=derived.id;state.derivedSource=null}if(!state.links.some(l=>l.type==='folder'&&l.id==='task'))state.links.push({id:'task',type:'folder',mode:'follow'});state.selected=state.available.includes(state.selected)?state.selected:state.available[0];state.events.push(state.draftHarness+': Entwurf V'+state.version+' erstellt und mit dem Task verknüpft');state.openFrom='task';state.page='review';state.inviteSent=false;showNotice('Demo-Lauf abgeschlossen. V'+state.version+' ist als interner Entwurf verfügbar.');render()}
root.addEventListener('click',e=>{
 const preview=e.target.closest('#ak-preview');
 if(preview&&state.pinMode){e.preventDefault();const rect=preview.getBoundingClientRect();state.pin={x:Math.round((e.clientX-rect.left)/rect.width*100),y:Math.round((e.clientY-rect.top)/rect.height*100)};state.pinMode=false;render();return}
 const control=e.target.closest('[data-action]');if(!control||control.disabled)return;
 const action=control.dataset.action;state.notice='';
 if(action.startsWith('tab-')){goTask(action.slice(4));return}
 if(action==='back-task'){goTask();return}
 if(action==='project'){state.page='project';state.folderFilter=control.dataset.folder||'task';state.openFrom='project';render();return}
 if(action==='folder-filter'){state.folderFilter=control.dataset.id;render();return}
 if(action==='view'){if(state.page!=='review'){const pinned=state.links.find(l=>l.type==='view'&&l.id===control.dataset.id&&l.mode==='pinned');state.reviewVersion=pinned?.version||state.version;state.readSpec=false}openView(control.dataset.id,state.page==='project'?'project':state.page==='task'?'task':state.openFrom);return}
 if(action==='picker'){state.page='picker';state.picks=new Set();state.pickMode='folder';state.pickQuery='';render();return}
 if(action==='create'){state.page='create';state.draftError='';render();return}
 if(action==='link-save'){for(const id of state.picks){if(!state.links.some(l=>l.id===id&&l.type===state.pickMode)){if(state.pickMode==='folder')state.links=state.links.filter(l=>!(l.type==='view'&&viewBy(l.id).folder===id));state.links.push({id,type:state.pickMode,mode:state.pickMode==='folder'?'follow':state.pickVersion,version:state.pickMode==='view'&&viewBy(id).folder==='task'?state.version:1})}}state.events.push(state.picks.size+' Showroom-Verknüpfungen hinzugefügt');showNotice('Auswahl mit diesem Task verknüpft. Die Inhalte bleiben im Showroom.');goTask();return}
 if(action==='unlink'){state.links=state.links.filter(l=>!(l.id===control.dataset.id&&l.type===control.dataset.type));state.events.push('Showroom-Verknüpfung entfernt');showNotice('Verknüpfung entfernt. Inhalte und Feedback bleiben im Showroom.');render();return}
 if(action==='start'){if(!state.draftBrief.trim()){state.draftError='Beschreibe bitte kurz, was entstehen soll.';render();return}if(!state.draftDesktop&&!state.draftMobile){state.draftError='Wähle mindestens eine Darstellung.';render();return}startRun('create');return}
 if(action==='cancel-run'){clearTimeout(runTimer);showNotice('Demo-Lauf abgebrochen. Der bisherige Stand bleibt erhalten.');goTask();return}
 if(action==='desktop'||action==='mobile'){state.viewport=action;render();return}

 if(action==='migrate'){state.legacy=false;state.converted=true;state.published=false;state.links=[{id:'task',type:'folder',mode:'follow'}];state.spec={version:2,ids:['invite','members','empty'],notes:state.notes};state.events.push('Bisherigen visuellen Entwurf mit 3 App-Screens übernommen');showNotice('Demo: 3 Screens, Feedback und Freigabe übernommen. Vorhandene Anhänge bleiben erhalten.');goTask();return}
 if(action==='text-info'){showNotice('Das Text-Refinement bleibt wie bisher verfügbar. Dieser Prototyp zeigt die Showroom-Abläufe.');render()}

 if(target.dataset.pick){target.checked?state.picks.add(target.dataset.pick):state.picks.delete(target.dataset.pick);root.querySelector('#ak-pick-summary').textContent=state.picks.size+' '+(state.pickMode==='folder'?'Ordner':'Ansichten')+' ausgewählt';root.querySelector('[data-action="link-save"]').disabled=!state.picks.size;return}
 if(target.id==='ak-link-version'){state.pickVersion=target.value;return}
 if(target.id==='ak-version'){state.reviewVersion=Number(target.value);state.readSpec=state.spec?.version===state.reviewVersion;state.inviteSent=false;state.pin=null;render();return}
 if(target.dataset.specPick){target.checked?state.specPicks.add(target.dataset.specPick):state.specPicks.delete(target.dataset.specPick);root.querySelector('#ak-spec-count').textContent=state.specPicks.size+' Ansichten ausgewählt';root.querySelector('[data-action="spec-save"]').disabled=!state.specPicks.size;return}
 if(target.dataset.iterationFeedback){target.checked?state.iterationFeedback.add(Number(target.dataset.iterationFeedback)):state.iterationFeedback.delete(Number(target.dataset.iterationFeedback));return}
 if(target.id==='ak-publish-confirm'){root.querySelector('[data-action="publish-save"]').disabled=!target.checked;return}
 if(target.id==='ak-harness')state.draftHarness=target.value;
 if(target.id==='ak-desktop')state.draftDesktop=target.checked;
 if(target.id==='ak-mobile')state.draftMobile=target.checked;
});
root.addEventListener('input',e=>{const el=e.target;if(el.id==='ak-search'){state.pickQuery=el.value;const position=el.selectionStart;render();const next=root.querySelector('#ak-search');next.focus();next.setSelectionRange(position,position)}if(el.id==='ak-brief')state.draftBrief=el.value;if(el.id==='ak-feedback-input')state.feedbackDraft=el.value;if(el.id==='ak-spec-notes')state.notes=el.value;});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.pinMode||state.pin)){state.pinMode=false;state.pin=null;render()}});
initial('empty');
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'layout',{label:'Ansichten darstellen',options:[{label:'Vorschaukarten',value:'cards'},{label:'Kompakte Zeilen',value:'rows'}]});tweak.addToggle(design,'showPaths',{label:'Ordnerpfade anzeigen'});}
})();
</script>
